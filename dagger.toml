# Dagger workspace configuration
# Install modules with: dagger install <module>
# Example:
#   dagger install github.com/dagger/dagger/modules/wolfi

[modules.go]
source = "github.com/dagger/go"

[modules.dagger-go-sdk]
source = "github.com/dagger/go-sdk"

[modules.test-env]
source = ".dagger/modules/test-env"

[modules.go.settings]
base = "test-env:base"

[modules.dagger-go-sdk.as-sdk]
name = "go"

[[modules.dagger-go-sdk.as-sdk.modules]]
path = ".dagger/modules/test-env"
