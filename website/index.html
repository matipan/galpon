<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="Galpon is a workstation for durable Pi, Claude Code and Codex coding agents in the Herdr desktop app. Try it in your browser.">
  <title>Galpon — Durable coding agents in the Herdr app</title>
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="preload" href="./fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Galpon sidebar">
      <header class="side-head">
        <span class="brand-mark"><i class="ic" style="--i:url(icons/layers.svg)"></i></span>
        <h1 class="brand">Galpon</h1>
        <span class="grow"></span>
        <button class="icon-btn" data-action="search" title="Search · Ctrl K" aria-label="Search"><i class="ic" style="--i:url(icons/search.svg)"></i></button>
        <button class="icon-btn" data-action="new-agent" title="New agent · Ctrl Alt N" aria-label="New agent"><i class="ic" style="--i:url(icons/plus.svg)"></i></button>
        <button class="icon-btn" data-action="close-sidebar" title="Hide the sidebar" aria-label="Hide the sidebar"><i class="ic" style="--i:url(icons/panel-left.svg)"></i></button>
      </header>
      <nav class="side-scroll" id="workspaces" aria-label="Workspaces"></nav>
      <section class="pulls" id="pulls" aria-label="Pull requests"></section>
    </aside>

    <main class="main">
      <div class="panes">
        <section class="card" id="card" aria-label="Agent tab"></section>
        <section class="card changes-card" id="changes-card" aria-label="Changes" hidden></section>
      </div>
      <footer class="statusbar">
        <button class="status-item only-narrow" data-action="open-sidebar" aria-label="Show the sidebar"><i class="ic" style="--i:url(icons/panel-left.svg)"></i></button>
        <span class="status-item wide-only"><i class="ic" style="--i:url(icons/monitor.svg)"></i> This computer</span>
        <span class="status-item muted" id="agent-count"></span>
        <span class="status-item demo">Browser demo · sample data</span>
        <span class="grow"></span>
        <a class="status-item" href="https://github.com/matipan/galpon" target="_blank" rel="noopener"><i class="ic" style="--i:url(icons/github.svg)"></i> GitHub</a>
        <button class="status-item" data-action="search"><kbd class="wide-only">Ctrl+K</kbd><i class="ic only-narrow" style="--i:url(icons/search.svg)"></i> Galpon</button>
        <button class="status-item wide-only" data-action="new-agent"><kbd>Ctrl+Alt+N</kbd> New agent</button>
      </footer>
    </main>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <div class="menu" id="menu" role="menu" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <noscript>
    <p class="noscript">Galpon is a workstation for durable Pi, Claude Code and Codex coding agents in the Herdr desktop app.
    This demo needs JavaScript. Read about Galpon on <a href="https://github.com/matipan/galpon">GitHub</a>.</p>
  </noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
