name: Deploy website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.website.config.mjs"
      - ".github/workflows/deploy-website.yml"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy galpon.dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Test website
        run: npm run test:site

      - name: Deploy website
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.134.0"
          command: deploy
