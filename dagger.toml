# Dagger workspace configuration
# Install modules with: dagger install <module>
# Example:
#   dagger install github.com/dagger/dagger/modules/wolfi

[modules.go]
source = "github.com/dagger/go@66b82ef4da32a20ede65577f9d63e1af2fd0eeb0"

[modules.dagger-go-sdk]
source = "github.com/dagger/go-sdk@d02ea66ae2eb45c0c193088393fbd064f0f4bc1a"

[modules.test-env]
source = ".dagger/modules/test-env"

[modules.go.settings]
base = "dag://test-env/base"

[sdks.go]
module = "dagger-go-sdk"

[sdks.go.scopes.".dagger/modules/test-env"]
is-module = true
